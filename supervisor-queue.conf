# Canonical queue processing for wizMedik = Laravel Horizon.
#
# IMPORTANT: This project uses Horizon (see config/horizon.php and the
# /horizon dashboard). Do NOT also run a plain "php artisan queue:work"
# against the same Redis queues - it competes with Horizon for the same
# jobs and the work never shows up in the dashboard. Run ONLY this program.
#
# Deploy:
#   sudo cp supervisor-queue.conf /etc/supervisor/conf.d/wizmedik-horizon.conf
#   # edit the absolute paths below to match the server
#   sudo supervisorctl reread && sudo supervisorctl update
#   sudo supervisorctl status
#
# After each deploy, gracefully reload workers so new code is picked up:
#   php artisan horizon:terminate   (Supervisor then auto-restarts Horizon)

[program:wizmedik-horizon]
process_name=%(program_name)s
command=php /path/to/backend/artisan horizon
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
; Horizon must run as a SINGLE master process; it spawns/balances the
; per-queue workers itself based on config/horizon.php.
numprocs=1
redirect_stderr=true
stdout_logfile=/path/to/backend/storage/logs/horizon.log
; Give in-flight jobs time to finish on graceful stop.
stopwaitsecs=3600
